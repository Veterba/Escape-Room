; Export presets, written by hand as text. tools/export.sh uses both.
; Options left out here keep Godot's defaults. The versions shown in the builds come from
; application/config/version in project.godot.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="art/game/*.txt"
exclude_filter="tests/*"
export_path="builds/windows/EscapeBoom.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=false
application/product_name="Escape Boom"

[preset.1]

name="macOS"
platform="macOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="art/game/*.txt"
exclude_filter="tests/*"
export_path="builds/EscapeBoom-macos.zip"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
binary_format/architecture="universal"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
application/bundle_identifier="org.escapeboom.game"
application/app_category="Games"
application/min_macos_version_x86_64="10.12"
application/min_macos_version_arm64="11.00"
; Built-in signing without an identity gives an ad-hoc signature: still "unsigned" for
; Gatekeeper, but Apple Silicon Macs refuse to run code with no signature at all.
codesign/codesign=1
notarization/notarization=0
